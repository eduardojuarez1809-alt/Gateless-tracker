<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateless - Dashboard de Supervisión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            padding: 30px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
        }

        .actions-bar {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-excel {
            background-color: #16a34a;
            color: white;
        }

        .btn-excel:hover {
            background-color: #15803d;
        }

        .btn-danger {
            background-color: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background-color: #b91c1c;
        }

        .table-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #00a8e8;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 14px 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
            color: #334155;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .badge-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background-color: #e2e8f0;
            color: #475569;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Dashboard de Supervisión de Agentes</h1>
        <div class="actions-bar">
            <button class="btn btn-excel" onclick="descargarCSV()">📊 Descargar Reporte CSV</button>
            <button class="btn btn-danger" onclick="reiniciarData()">🗑️ Reiniciar Data</button>
        </div>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Agente</th>
                    <th>Estado</th>
                    <th>Hora Inicio</th>
                    <th>Hora Fin</th>
                    <th>Duración (Min)</th>
                    <th>Overtime</th>
                    <th>Fecha Registro</th>
                </tr>
            </thead>
            <tbody id="logsTableBody">
                <tr>
                    <td colspan="7" class="empty-state">Cargando registros...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        let globalLogs = [];

        async function cargarLogs() {
            try {
                const response = await fetch('/api/logs');
                if (!response.ok) throw new Error("Error al obtener datos");
                
                globalLogs = await response.json();
                renderTabla(globalLogs);
            } catch (error) {
                console.error("Error al cargar registros:", error);
            }
        }

        function renderTabla(logs) {
            const tbody = document.getElementById('logsTableBody');
            if (logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No hay marcas registradas aún.</td></tr>`;
                return;
            }

            tbody.innerHTML = logs.map(log => {
                const horaInicio = log.start_time ? new Date(log.start_time).toLocaleTimeString() : '-';
                const horaFin = log.end_time ? new Date(log.end_time).toLocaleTimeString() : 'En curso';
                const fecha = log.created_at ? new Date(log.created_at).toLocaleDateString() : '-';

                return `
                    <tr>
                        <td><strong>${log.agent || 'Anónimo'}</strong></td>
                        <td><span class="badge-status">${log.status || '-'}</span></td>
                        <td>${horaInicio}</td>
                        <td>${horaFin}</td>
                        <td>${log.duration_minutes !== null ? log.duration_minutes : '-'} min</td>
                        <td>${log.overtime || 'No'}</td>
                        <td>${fecha}</td>
                    </tr>
                `;
            }).join('');
        }

        async function reiniciarData() {
            if (confirm("¿Estás seguro de que deseas eliminar todas las marcas de los agentes? Esta acción no se puede deshacer.")) {
                try {
                    const response = await fetch('/api/logs', { method: 'DELETE' });
                    if (response.ok) {
                        alert("Base de datos reiniciada correctamente.");
                        cargarLogs();
                    } else {
                        alert("Error al intentar borrar los registros.");
                    }
                } catch (e) {
                    alert("Error de conexión al reiniciar la base de datos.");
                }
            }
        }

        function descargarCSV() {
            if (globalLogs.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,ID,Agente,Estado,Hora Inicio,Hora Fin,Duración (Min),Overtime,Fecha\n";

            globalLogs.forEach(row => {
                const inicio = row.start_time ? new Date(row.start_time).toLocaleString() : '';
                const fin = row.end_time ? new Date(row.end_time).toLocaleString() : '';
                csvContent += `"${row.id}","${row.agent}","${row.status}","${inicio}","${fin}","${row.duration_minutes}","${row.overtime}","${row.created_at}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Gateless_Reporte_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Cargar registros al abrir y actualizar automáticamente cada 5 segundos
        window.onload = () => {
            cargarLogs();
            setInterval(cargarLogs, 5000);
        };
    </script>
</body>
</html>
